name: Juejin Auto Check-in (Node.js)

on:
  schedule:
    # 每天北京时间上午9:00执行 (UTC 时间是 1:00)
    - cron: '0 1 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 使用一个LTS版本

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 安装 Playwright 浏览器驱动
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 5. 从 Secret 创建 auth.json（推荐 Secret 存 base64，自动兼容原始 JSON）
      - name: Create auth.json from Secret
        env:
          JUEJIN_AUTH_JSON: ${{ secrets.JUEJIN_AUTH_JSON }}
        run: |
          # 先按 base64 解码，解码失败则按原始 JSON 写入
          if echo "$JUEJIN_AUTH_JSON" | base64 -d 2>/dev/null | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
            echo "$JUEJIN_AUTH_JSON" | base64 -d > auth.json
            echo "auth.json 已从 base64 解码创建"
          else
            printf '%s' "$JUEJIN_AUTH_JSON" > auth.json
            echo "auth.json 已按原始 JSON 创建"
          fi
          # 校验 JSON 是否合法
          python3 -c "import json; json.load(open('auth.json'))" && echo "auth.json JSON 格式合法" || { echo "auth.json 格式错误！请检查 Secret"; exit 1; }

      # 6. 运行主脚本
      - name: Run Playwright script
        run: node main.js

      # 7. 始终上传调试截图（main.js 不会以失败退出，不能用 if: failure()）
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
